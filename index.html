    .container {
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card img {
  width: 100%;
  height: auto;   /* ✅ keep original ratio */
  border-radius: 8px;
}

    .price {
      font-size: 18px;
      margin: 10px 0;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      color: white;
      font-size: 14px;
    }

    .buy {

    }

    .telegram {

    .footer {

</head>
